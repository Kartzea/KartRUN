<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kart Run ~by Kartzea</title>

    <style>
        .body{
            background-color: black;
            color: white;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            margin-top: 20vh;
        }

        .main{
            width: 1200px;
            height: 600px;
            background-color: rgb(14, 5, 66);
            margin: 0 auto;

        }


    </style>

</head>
<body class="body">
    
    <main class="main">
        <canvas id="gameCanvas" width="1200" height="600"></canvas>
    </main>

<script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");

    var carro = new Image();
    carro.src = "carro.png";

    var posicaoX = 0;
    var posicaoY = 0;

    carro.onload = function() {
        atualizarCanvas();
    };

    document.addEventListener("keydown", function(event) {

        if (event.key === "ArrowRight") {
            posicaoX += 50;
            
            if (posicaoX > canvas.width - 200) {
                posicaoX = canvas.width - 200;
            }
            atualizarCanvas();
        }

        if (event.key === "ArrowLeft") {
            posicaoX -= 50;
            
            if (posicaoX < 0) {
                posicaoX = 0;
            }
            atualizarCanvas();
        }

        if (event.key === "ArrowUp") {
            posicaoY -= 50;
            
            if (posicaoY < 0) {
                posicaoY = 0;
            }
            atualizarCanvas();
        }

        if (event.key === "ArrowDown") {
            posicaoY += 50;
            
            if (posicaoY > canvas.height - 200) {
                posicaoY = canvas.height - 200;
            }
            atualizarCanvas();
        }

    });

    function atualizarCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(carro, posicaoX, posicaoY, 200, 200);
    }
</script>
    
</body>
</html>
