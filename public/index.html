<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KARTRUNNN</title>

    <style>
        .body{
            background-color: rgb(66, 66, 66);

            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        #myCanvas{

            background-color: rgb(129, 129, 129);

        }
    </style>
</head>
<body class="body">
    <canvas id="myCanvas"></canvas>


    <script>
        // Controles
        class Constrols {
            constructor() {
                
                this.forward = false;
                this.left = false;
                this.right = false;
                this.reverse = false;

                this.#addKeyboardListeners()

            }
            #addKeyboardListeners(){
                document.onkeydown = (event) => {
                    switch(event.key) {
                        case "ArrowLeft":
                            this.left = true
                            break
                        case "ArrowRight":
                            this.right = true
                            break
                        case "ArrowUp":
                            this.up = true
                            break
                        case "ArrowDown":
                            this.down = true
                            break
                        console.log(this)
                    }
                }
                
                document.onkeyup = (event) => {
                    switch(event.key) {
                        case "ArrowLeft":
                            this.left = false
                            break
                        case "ArrowRight":
                            this.right = false
                            break
                        case "ArrowUp":
                            this.up = false
                            break
                        case "ArrowDown":
                            this.down = false
                            break
                        console.log(this)
                    }
                }
            }
        }
        // Carro
        class Car {
            constructor(x,y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;

                this.controls = new Constrols();
            }

            update(){
                if(this.controls.up){
                    this.y -= 2
                }             
                if(this.controls.down){
                    this.y += 2
                }   
            }
            
            draw(ctx) {
                ctx.beginPath();
                    ctx.rect(
                        this.x - this.width / 2,
                        this.y - this.height / 2,
                        this.width,
                        this.height
                    )
                    ctx.fill()

            }
        }

        const canvas = document.getElementById('myCanvas');
        canvas.width = 400;
        
        const ctx = canvas.getContext('2d');
        const car = new Car(200,400, 100, 120);
        
        animate()
        
        function animate(){
            car.update(),
            canvas.height = window.innerHeight;
            car.draw(ctx)
            requestAnimationFrame(animate)
        }






    </script>

</body>
</html>
