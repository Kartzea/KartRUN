<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KARTRUNNN</title>

    <style>
        .body{
            background-color: rgb(66, 66, 66);

            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        #myCanvas{

            background-color: rgb(129, 129, 129);

        }
    </style>
</head>
<body class="body">
    <canvas id="myCanvas"></canvas>


    <script>
        const carImage = new Image();
        carImage.src = "carro.png";
        // Controles
        class Constrols {
            constructor() {
                
                this.forward = false;
                this.left = false;
                this.right = false;
                this.reverse = false;

                this.#addKeyboardListeners()

            }
            #addKeyboardListeners(){
                document.onkeydown = (event) => {
                    switch(event.key) {
                        case "ArrowLeft":
                            this.left = true
                            break
                        case "ArrowRight":
                            this.right = true
                            break
                        case "ArrowUp":
                            this.up = true
                            break
                        case "ArrowDown":
                            this.down = true
                            break
                        console.log(this)
                    }
                }
                
                document.onkeyup = (event) => {
                    switch(event.key) {
                        case "ArrowLeft":
                            this.left = false
                            break
                        case "ArrowRight":
                            this.right = false
                            break
                        case "ArrowUp":
                            this.up = false
                            break
                        case "ArrowDown":
                            this.down = false
                            break
                        console.log(this)
                    }
                }
            }
        }
        // Carro
        class Car {
            constructor(x,y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;

                this.speed = 0
                this.acceleration = 0.5
                this.maxSpeed = 3
                this.friction = 0.05
                this.angle = 0

                this.controls = new Constrols();
            }

            update(){
                if(this.controls.up){
                    this.speed += this.acceleration
                }             
                if(this.controls.down){
                    this.speed -= this.acceleration
                }
                if(this.speed > this.maxSpeed){
                    this.speed = this.maxSpeed
                }
                if (this.speed < -this.maxSpeed/2){
                    this.speed = -this.maxSpeed/2
                }
                if(this.speed > 0){
                    this.speed -= this.friction
                }
                if(this.speed < 0){
                    this.speed += this.friction
                }
                if(Math.abs(this.speed) < this.friction){
                    this.speed = 0
                } 
                if(this.speed != 0){
                    const flip = this.speed > 0?1:-1
                    if(this.controls.left){
                        this.angle += 0.03 * flip
                    }
                    if(this.controls.right){
                        this.angle -= 0.03 * flip
                    }
                }
                this.x -= Math.sin(this.angle)*this.speed
                this.y -= Math.cos(this.angle)*this.speed  
            }
            
            draw(ctx) {
                ctx.save()
                ctx.translate(this.x,this.y)
                ctx.rotate(-this.angle)


                ctx.drawImage(
                    carImage,
                        - this.width / 2,
                        - this.height / 2,
                        this.width,
                        this.height
                    );

                    ctx.restore()

            }
        }

        const canvas = document.getElementById('myCanvas');
        canvas.width = 1000;
        
        const ctx = canvas.getContext('2d');
        const car = new Car(200,400, 200, 200);
        
        animate()
        
        function animate(){
            car.update(),
            canvas.height = window.innerHeight;
            car.draw(ctx)
            requestAnimationFrame(animate)
        }






    </script>

</body>
</html>
