<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kart Run ~by Kartzea</title>

    <style>
        .body{
            background-color: black;
            color: white;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            margin-top: 20vh;
        }

        .main{
            width: 120vh;
            height: 70vh;
            background-color: rgb(14, 5, 66);
            margin: 0 auto;

        }
    </style>

</head>
<body class="body">
    
    <main class="main">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </main>

    <script>
        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");

        var carro = new Image()
        carro.src = "carro.png"

        carro.onload = function() {
            ctx.drawImage(carro, 50, 50, 200, 200);
        };
    </script>
    
</body>
</html>
